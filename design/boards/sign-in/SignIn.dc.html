<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&amp;family=Marcellus&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050A12}
a{color:#D4AF6A}a:hover{color:#F0D08E}
@keyframes kb{from{transform:scale(1.08) translate(-1.5%,1%)}to{transform:scale(1.18) translate(1.5%,-1%)}}
@keyframes waveA{0%{transform:translate(-7px,0);opacity:.12}50%{opacity:.6}100%{transform:translate(7px,2px);opacity:.12}}
@keyframes waveB{0%{transform:translate(6px,1px);opacity:.5}50%{opacity:.1}100%{transform:translate(-6px,-1px);opacity:.5}}
@keyframes surf{0%,100%{stroke-opacity:.22;stroke-width:9}50%{stroke-opacity:.5;stroke-width:15}}
@keyframes drift{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,-3%,0)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-300px) translateX(30px);opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.kb{animation:kb 60s ease-in-out infinite alternate;transform-origin:50% 50%}
.wa{animation:waveA 7s ease-in-out infinite alternate}
.wb{animation:waveB 9s ease-in-out infinite alternate}
.surf{animation:surf 6s ease-in-out infinite}
.fog{position:absolute;pointer-events:none;border-radius:50%;filter:blur(50px);animation:drift 46s ease-in-out infinite alternate}
.ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#F2B866;box-shadow:0 0 8px #F2B866;animation:rise 16s linear infinite}
.ping{position:absolute;width:10px;height:10px;border-radius:50%;background:#F0D08E;box-shadow:0 0 12px #F0D08E}
.ping:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #F0D08E;animation:ping 2.8s ease-out infinite}
a:focus-visible,button:focus-visible{outline:2px solid #F0D08E;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.kb,.wa,.wb,.surf,.fog,.ember,.ping:after{animation:none}.ember{display:none}}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 900px; overflow: hidden; background: #050A12; font-family: Inter, system-ui, sans-serif; color: #E6E1D6">
  <!-- slow drifting map -->
  <div class="kb" style="position: absolute; top: 0; left: 50%; width: 1440px; height: 900px; margin-left: -720px; opacity: .75">
    <svg width="1440" height="900" viewBox="0 0 1440 900" aria-hidden="true" style="position: absolute; inset: 0">
      <defs>
        <radialGradient id="sSea" cx="45%" cy="50%" r="75%"><stop offset="0" stop-color="#10233A"></stop><stop offset="1" stop-color="#03070D"></stop></radialGradient>
        <linearGradient id="sLand" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="#22304A"></stop><stop offset="1" stop-color="#121A28"></stop></linearGradient>
        <filter id="sBlur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
      </defs>
      <rect width="1440" height="900" fill="url(#sSea)"></rect>
      <g class="wa" fill="none" stroke="#7FA9D6" stroke-width="0.8"><sc-for list="{{wavesA}}" as="w" hint-placeholder-count="0"><path d="{{w.d}}"></path></sc-for></g>
      <g class="wb" fill="none" stroke="#7FA9D6" stroke-width="0.8"><sc-for list="{{wavesB}}" as="w" hint-placeholder-count="0"><path d="{{w.d}}"></path></sc-for></g>
      <g fill="none" stroke="#5E93C9" filter="url(#sBlur)"><path class="surf" d="{{coastK}}"></path><path class="surf" d="{{coastE}}"></path></g>
      <sc-for list="{{zones}}" as="z" hint-placeholder-count="0"><path d="{{z.d}}" fill="url(#sLand)" fill-rule="evenodd" stroke="rgba(201,164,92,0.28)" stroke-width="0.7"></path></sc-for>
      <path d="{{coastK}}" fill="none" stroke="#A9C8EA" stroke-opacity="0.45" stroke-width="1.1"></path>
      <path d="{{coastE}}" fill="none" stroke="#A9C8EA" stroke-opacity="0.45" stroke-width="1.1"></path>
    </svg>
    <span class="ping" style="left: 768px; top: 765px"></span>
    <span class="ping" style="left: 655px; top: 695px"></span>
    <span class="ping" style="left: 725px; top: 252px"></span>
    <span class="ping" style="left: 377px; top: 400px"></span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(5,10,18,0.15) 0%, rgba(5,10,18,0.55) 55%, rgba(5,10,18,0.92) 100%)"></div>
  <div class="fog" style="left: 10%; top: 55%; width: 700px; height: 260px; background: radial-gradient(closest-side, rgba(150,175,210,0.16), rgba(150,175,210,0))"></div>
  <div class="fog" style="left: 40%; top: 10%; width: 700px; height: 240px; background: radial-gradient(closest-side, rgba(150,175,210,0.12), rgba(150,175,210,0)); animation-delay: -20s"></div>
  <span class="ember" style="left: 30%; top: 90%"></span><span class="ember" style="left: 55%; top: 95%; animation-delay: -5s"></span><span class="ember" style="left: 70%; top: 92%; animation-delay: -10s"></span><span class="ember" style="left: 44%; top: 98%; animation-delay: -13s"></span>

  <!-- PANEL -->
  <main style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; max-width: calc(100% - 32px); box-sizing: border-box; padding: 40px 36px 30px; border-radius: 20px; background: rgba(10,16,28,0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(212,175,106,0.4); box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(240,208,142,0.15); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
    <svg width="56" height="56" viewBox="0 0 26 26" aria-hidden="true" fill="#121B2A" stroke="#F0D08E" stroke-width="1.1" style="filter: drop-shadow(0 0 14px rgba(240,208,142,0.35))"><path d="M13 2l9 4v7c0 6-4 9-9 11C8 22 4 19 4 13V6z"></path><path d="M13 7v12M8 12h10"></path></svg>
    <h1 style="margin: 0; font: 36px/1.05 'Marcellus SC', serif; letter-spacing: .06em; color: #F3DFAE; text-shadow: 0 0 24px rgba(240,208,142,0.3)">Doombringers</h1>
    <p style="margin: 0; font: 17px/1.4 'Marcellus', serif; color: #C9CFD9">Where is everyone in Azeroth tonight?</p>
    <a href="Main.dc.html" style="margin-top: 10px; width: 100%; min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; background: linear-gradient(180deg, #1A8CFF, #0B66D6); color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 24px rgba(11,102,214,0.35), inset 0 1px 0 rgba(255,255,255,0.25)">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#FFFFFF" stroke-width="1.6" aria-hidden="true"><rect x="3" y="8" width="12" height="8" rx="2"></rect><path d="M6 8V5.5a3 3 0 0 1 6 0V8"></path></svg>
      Sign in with Battle.net
    </a>
    <p style="margin: 0; font-size: 12px; color: #8E98A8; line-height: 1.5">For the friends on the guest list. We only read your BattleTag, nothing else.</p>
  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 11px; color: #6E7888; padding: 0 16px">Private fan site · not affiliated with Blizzard Entertainment · Zone outlines: Wikimedia Commons (CC BY-SA)</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    fetch('./assets/e00c3a54db413db7dd2e2d2dfc63d371.json').then(function (r) { return r.json(); }).then((m) => { this.setState({ map: m }); }).catch(function () {});
  }
  waves(o) {
    var out = [];
    for (var y = 40 + o * 17; y < 900; y += 34) {
      for (var x = 10 + o * 28; x < 1440; x += 56) {
        var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; var j = h - Math.floor(h);
        var w = 6 + j * 6;
        out.push({ d: 'M' + (x + j * 24).toFixed(1) + ' ' + (y + (j - 0.5) * 12).toFixed(1) + ' q' + (w / 2).toFixed(1) + ' -3 ' + w.toFixed(1) + ' 0 t' + w.toFixed(1) + ' 0' });
      }
    }
    return out;
  }
  renderVals() {
    var m = (this.state || {}).map;
    return {
      zones: m ? m.zones.map(function (z) { return { d: z.d }; }) : [],
      coastK: m ? m.coast.K : '', coastE: m ? m.coast.E : '',
      wavesA: this.waves(0), wavesB: this.waves(1)
    };
  }
}
</script>
</body>
</html>
