<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&amp;family=Marcellus&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050A12}
a{color:#D4AF6A}a:hover{color:#F0D08E}
@keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.6);opacity:0}}
@keyframes waveA{0%{transform:translate(-7px,0);opacity:.12}50%{opacity:.6}100%{transform:translate(7px,2px);opacity:.12}}
@keyframes waveB{0%{transform:translate(6px,1px);opacity:.5}50%{opacity:.1}100%{transform:translate(-6px,-1px);opacity:.5}}
@keyframes surf{0%,100%{stroke-opacity:.22;stroke-width:9}50%{stroke-opacity:.5;stroke-width:15}}
@keyframes foam{to{stroke-dashoffset:-220}}
@keyframes driftA{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,-3%,0)}}
.wa{animation:waveA 7s ease-in-out infinite alternate}
.wb{animation:waveB 9s ease-in-out infinite alternate}
.surf{animation:surf 6s ease-in-out infinite}
.foam{stroke-dasharray:1.2 10;animation:foam 40s linear infinite}
.fog{position:absolute;pointer-events:none;border-radius:50%;filter:blur(36px);animation:driftA 40s ease-in-out infinite alternate}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;box-sizing:border-box;font:600 10px/24px Inter,system-ui,sans-serif;text-align:center;text-decoration:none}
.pulse{position:absolute;inset:-2px;border-radius:50%;animation:pulse 2.6s ease-out infinite;pointer-events:none}
.age{position:absolute;font:500 10px/1 Inter,system-ui,sans-serif;color:#9AA3B2;padding:3px 5px;border-radius:4px;background:rgba(5,10,18,.8);white-space:nowrap}
a:focus-visible,button:focus-visible{outline:2px solid #F0D08E;outline-offset:3px}
.still .wa,.still .wb,.still .surf,.still .foam,.still .pulse,.still .fog{animation:none}
@media (prefers-reduced-motion: reduce){.wa,.wb,.surf,.foam,.pulse,.fog{animation:none}}
</style>
</helmet>

    <g class="wb" fill="none" stroke="#7FA9D6" stroke-width="0.8" stroke-linecap="round"><sc-for list="{{wavesB}}" as="w" hint-placeholder-count="0"><path d="{{w.d}}"></path></sc-for></g>
    <path class="surf" d="{{coastE}}" fill="none" stroke="#5E93C9" filter="url(#pBlur)"></path>

    </sc-for>
    <sc-for list="{{zones}}" as="z" hint-placeholder-count="0">

    <path d="{{coastE}}" fill="none" stroke="#A9C8EA" stroke-opacity="0.55" stroke-width="1.1"></path>

    <g text-anchor="middle" stroke="#070B12" stroke-width="3" paint-order="stroke" stroke-linejoin="round">

      </sc-for>
    </g>
    <g stroke="#F0D08E" stroke-opacity="0.75" stroke-width="1.1"><line x1="773" y1="778" x2="756" y2="764"></line><line x1="773" y1="778" x2="790" y2="758"></line></g>
    <circle cx="773" cy="778" r="3" fill="#F0D08E"></circle>
  </svg>

    <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="#D4AF6A" stroke-width="1.6"><path d="M13 2l9 4v7c0 6-4 9-9 11C8 22 4 19 4 13V6z"></path><path d="M13 7v12M8 12h10"></path></svg>
    <span style="font: 17px 'Marcellus SC', serif; letter-spacing: .06em; color: #F0D08E">Doombringers</span>

    <span style="width: 32px; height: 32px; border-radius: 50%; background: #2A3446; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #F0D08E">N</span>
  </header>

  <!-- continent switch -->
  <button aria-haspopup="listbox" style="position: absolute; left: 12px; top: 66px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(212,175,106,0.35); background: rgba(12,18,30,0.82); color: #F3EBDA; font: 600 12px Inter, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">Eastern Kingdoms <span style="color: #D4AF6A">▾</span></button>
  <span style="position: absolute; right: 12px; top: 76px; font-size: 11px; color: #8E98A8">Updated just now</span>

  <!-- BOTTOM SHEET (peek) -->

    <a href="PhoneRoll.dc.html" aria-label="Open roll call" style="align-self: center; display: block; width: 60px; height: 20px; position: relative"><span style="position: absolute; left: 12px; right: 12px; top: 6px; height: 4px; border-radius: 2px; background: rgba(212,175,106,0.5)"></span></a>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px">
      <h2 style="margin: 0; font: 18px 'Marcellus SC', serif; letter-spacing: .05em; color: #F0D08E">Roll call</h2>

    <div style="display: flex; gap: 8px; padding: 0 16px; overflow-x: auto">
      <a href="PhoneCharacter.dc.html" style="flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; min-height: 44px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); text-decoration: none"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: #0B0F14; font: 600 10px/28px Inter, sans-serif; text-align: center">LT</span><span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; color: #FFFFFF">Lia · 1 h</span><span style="font-size: 11px; color: #8E98A8">Stranglethorn</span></span></a>
      <a href="PhoneCharacter.dc.html" style="flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; min-height: 44px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); text-decoration: none"><span style="width: 28px; height: 28px; border-radius: 50%; background: #8788EE; color: #0B0F14; font: 600 10px/28px Inter, sans-serif; text-align: center">VD</span><span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; color: #A9AAF5">Ves · 2 h</span><span style="font-size: 11px; color: #8E98A8">Stranglethorn</span></span></a>
      <a href="PhoneCharacter.dc.html" style="flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; min-height: 44px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); text-decoration: none"><span style="width: 28px; height: 28px; border-radius: 50%; background: #FFF468; color: #0B0F14; font: 600 10px/28px Inter, sans-serif; text-align: center">BE</span><span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 600; color: #FFF468">Bob · 5 h</span><span style="font-size: 11px; color: #8E98A8">Deadmines</span></span></a>

    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #F0D08E; text-decoration: none"><svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#F0D08E" stroke-width="1.8" aria-hidden="true"><path d="M3 7l7-3 8 3 7-3v17l-7 3-8-3-7 3z M10 4v17 M18 7v17"></path></svg>Map</a>

  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Atmosphere"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    fetch('./assets/e00c3a54db413db7dd2e2d2dfc63d371.json').then(function (r) { return r.json(); }).then((m) => { this.setState({ map: m }); }).catch(function () {});
  }
  waves(o) {
    var out = [];
    for (var y = 195 + o * 13; y < 940; y += 26) {
      for (var x = 600 + o * 20; x < 1015; x += 40) {
        var h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; var j = h - Math.floor(h);
        var w = 6 + j * 6;
        out.push({ d: 'M' + (x + j * 18).toFixed(1) + ' ' + (y + (j - 0.5) * 10).toFixed(1) + ' q' + (w / 2).toFixed(1) + ' -3 ' + w.toFixed(1) + ' 0 t' + w.toFixed(1) + ' 0' });
      }
    }
    return out;
  }
  renderVals() {
    var m = (this.state || {}).map;
    var occ = { stv: 0.2, westfall: 0.15, hillsbrad: 0.1 };
    var live = { stv: 1, westfall: 1 };
    var zones = [], labels = [], capitals = [];
    if (m) {
      m.zones.filter(function (z) { return z.cont === 'E'; }).forEach(function (z) {
        var terr = z.kind === 'terrain';
        zones.push({ d: z.d, fill: terr ? '#0C121B' : 'url(#pLand)', glow: occ[z.id] || 0, stroke: terr ? 'rgba(201,164,92,0.12)' : 'rgba(201,164,92,0.36)', sw: 0.7 });
        var two = z.lines.length > 1, fs = z.size + 1;
        labels.push({ x: z.lx, y1: two ? z.ly - fs * 0.3 : z.ly + fs * 0.35, y2: z.ly + fs * 0.85, l1: z.lines[0], l2: two ? z.lines[1] : '', fs: fs,
          fill: terr ? '#56627A' : (live[z.id] ? '#F3DFAE' : (occ[z.id] ? '#D3D9E3' : '#A4AEBF')),
          font: terr ? "font-family: 'Marcellus', serif; font-style: italic" : "font-family: 'Marcellus SC', serif; letter-spacing: .06em" });
      });
      m.cities.filter(function (c) { return c.cap; }).forEach(function (c) { capitals.push({ t: 'translate(' + c.x + ' ' + c.y + ') rotate(45)' }); });
    }
    var motion = this.props.motion ?? true;
    return { zones: zones, labels: labels, capitals: capitals, coastE: m ? m.coast.E : '', wavesA: this.waves(0), wavesB: this.waves(1), rootClass: motion ? '' : 'still' };
  }
}
</script>
