name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # The release image (WEB-07), built but not pushed, so a broken Dockerfile shows up before a tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: communitiesforever-web:ci
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, migrates a fresh /data and answers the health check.
      - name: Health check
        run: |
          docker run -d --name web -p 3000:3000 -e AUTH_SECRET=ci-secret-at-least-32-characters-long \
            communitiesforever-web:ci
          for i in $(seq 30); do
            body=$(curl -fsS http://localhost:3000/api/health) && break
            sleep 1
          done
          echo "$body"
          [ "$body" = '{"ok":true,"version":"ci"}' ] || { docker logs web; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/guests)
          [ "$status" = 401 ] || { echo "::error::/api/admin/guests answered $status without a session"; exit 1; }
          docker exec web ls /data/communitiesforever.sqlite
