name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: No merge-conflict markers
        run: "! git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!design/'"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Design checks (WEB-30, tests/design/README.md) in the Playwright image, so screenshots render the same on every
  # run. The image tag matches @playwright/test in package-lock.json: bump both together.
  design:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: the image has no compiler for better-sqlite3's node-gyp rebuild, and the package loads its
      # bundled prebuilt binding anyway (docs/ARCHITECTURE.md Stack).
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Screenshots that differ are written as new baselines instead of failing here; the next step fails on them
      # and uploads them, so a changed look comes back as files to review and commit (after Nico approved it).
      - run: npm run test:design -- --update-snapshots=changed
      - name: Screenshot baselines unchanged
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changed=$(git status --porcelain tests/design/__screenshots__)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Screenshots differ from the baselines. Review the design-baselines artifact; commit it only after Nico approved the new look (tests/design/README.md)."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: design-baselines
          path: tests/design/__screenshots__/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: design-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The release image (WEB-07), built but not pushed, so a broken Dockerfile shows up before a tag.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: communitiesforever-web:ci
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, migrates a fresh /data and answers the health check.
      - name: Health check
        run: |
          docker run -d --name web -p 3000:3000 -e AUTH_SECRET=ci-secret-at-least-32-characters-long \
            communitiesforever-web:ci
          for i in $(seq 30); do
            body=$(curl -fsS http://localhost:3000/api/health) && break
            sleep 1
          done
          echo "$body"
          [ "$body" = '{"ok":true,"version":"ci"}' ] || { docker logs web; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/guests)
          [ "$status" = 401 ] || { echo "::error::/api/admin/guests answered $status without a session"; exit 1; }
          docker exec web ls /data/communitiesforever.sqlite
