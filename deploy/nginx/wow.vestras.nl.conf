# nginx server block for wow.vestras.nl (WEB-07, deploy/README.md step 2): TLS here, plain HTTP to the app on the LAN.
# Replace <truenas-ip> and the certificate paths with yours.

upstream communitiesforever {
    server <truenas-ip>:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wow.vestras.nl;

    # Let's Encrypt HTTP-01 challenges, if certificates are renewed through this server.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wow.vestras.nl;

    ssl_certificate     /etc/letsencrypt/live/wow.vestras.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wow.vestras.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:communitiesforever:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploads are at most 25 MiB (MAX_UPLOAD_BYTES), plus the multipart envelope.
    client_max_body_size 30m;

    location / {
        proxy_pass http://communitiesforever;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Auth.js builds its callback and cookie settings from these (trustHost is on, AUTH_URL names the origin).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # A large upload is parsed and merged before the answer: give it time.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Hand an upload to the app as it arrives instead of buffering it to disk first.
        proxy_request_buffering off;
    }
}
